[package]
name = "utai-audio"
version = "0.1.0"
edition = "2021"
description = "Native audio engine for the utai.au desktop app: PCM streaming + mix + device I/O."

# Its own workspace so cargo doesn't try to fold it into the `app` crate above.
[workspace]

[lib]
name = "utai_audio"

[dependencies]
# Lock-free SPSC ring for handing mic frames from the input callback to the
# output callback without blocking either real-time thread.
rtrb = "0.3"
# FFT for the real-time partitioned convolution reverb.
rustfft = "6.4"

# The device layer (cpal I/O + arc-swap for the lock-free track hand-off + log)
# is optional so the pure mixer/transport core builds and
# unit-tests without system audio libs (alsa/CoreAudio/WASAPI). Real desktop
# builds enable `device`.
cpal = { version = "0.15", optional = true }
arc-swap = { version = "1", optional = true }
log = { version = "0.4", optional = true }
# Compiles the Signalsmith Stretch C++, so behind a feature: the WASM effects
# build has no C++ toolchain to run it with.
ssstretch = { version = "0.1", optional = true }

[features]
default = []
stretch = ["dep:ssstretch"]
device = ["stretch", "dep:cpal", "dep:arc-swap", "dep:log"]
